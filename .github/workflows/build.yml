name: Build ChillGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Запуск вручную кнопкой на GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest  # Бесплатный сервер GitHub с 7 ГБ RAM

    steps:

      # 1. Получить код
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Важно для Telegram FOSS

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. NDK r25c (именно эта версия нужна Telegram FOSS)
      - name: Install NDK r25c
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. Вставить App ID (из GitHub Secrets — безопасно)
      - name: Inject App credentials
        run: |
          cat > TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java << 'EOF'
          package org.telegram.messenger;
          public class BuildVars {
              public static final int APP_ID = ${{ secrets.TELEGRAM_APP_ID }};
              public static final String APP_HASH = "${{ secrets.TELEGRAM_APP_HASH }}";
              public static boolean DEBUG_VERSION = false;
              public static boolean USE_CLOUD_STRINGS = false;
              public static boolean CHECK_UPDATES = false;
          }
          EOF

      # 6. Кэш Gradle (ускоряет повторные сборки)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 7. Дать права на gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 8. Сборка APK
      - name: Build Release APK
        run: |
          ./gradlew assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.parallel=true \
            --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 9. Подписать APK (keystore из Secrets)
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: TMessagesProj/build/outputs/apk/afat/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 10. Переименовать APK в ChillGram
      - name: Rename APK
        run: |
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} \
             TMessagesProj/build/outputs/apk/afat/release/ChillGram-v1.0.apk

      # 11. Загрузить APK как артефакт (скачать со страницы Actions)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChillGram-APK
          path: TMessagesProj/build/outputs/apk/afat/release/ChillGram-v1.0.apk
          retention-days: 30  # Хранить 30 дней
